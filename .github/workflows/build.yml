name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ya trae el Android SDK en $ANDROID_HOME
      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk teleprompter-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: teleprompter-v${{ github.run_number }}.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            "teleprompter-v${{ github.run_number }}.apk" \
            --title "Teleprompter v${{ github.run_number }}" \
            --notes "Build automático de ${{ github.sha }}. Descarga el APK e instálalo." \
            --latest
