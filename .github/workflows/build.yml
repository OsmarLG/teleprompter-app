name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ya trae el Android SDK en $ANDROID_HOME
      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # La llave de firma vive en los secretos del repo, nunca en el código.
      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.TELEPROMPTER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/teleprompter.keystore"
            echo "TELEPROMPTER_KEYSTORE_FILE=$RUNNER_TEMP/teleprompter.keystore" >> "$GITHUB_ENV"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Falta el secreto TELEPROMPTER_KEYSTORE_B64: no se publica un APK firmado con otra llave." >&2
            exit 1
          fi

      - name: Compilar APK
        env:
          TELEPROMPTER_KEYSTORE_PASSWORD: ${{ secrets.TELEPROMPTER_KEYSTORE_PASSWORD }}
          TELEPROMPTER_KEY_ALIAS: ${{ secrets.TELEPROMPTER_KEY_ALIAS }}
          TELEPROMPTER_KEY_PASSWORD: ${{ secrets.TELEPROMPTER_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk teleprompter-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: teleprompter-v${{ github.run_number }}.apk

      # Solo main publica en Releases; las otras ramas solo compilan (y dejan el APK como artefacto).
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            "teleprompter-v${{ github.run_number }}.apk" \
            --title "Teleprompter v${{ github.run_number }}" \
            --notes "Build automático de ${{ github.sha }}. Descarga el APK e instálalo." \
            --latest
